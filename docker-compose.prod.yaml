services:
  www:
    image: nginx:1
    volumes:
      - ${PWD}/backend/:/var/www
      - ${PWD}/docker/production/nginx/api.conf:/etc/nginx/nginx.conf:ro
      - ${PWD}/docker/production/nginx/log/api/:/var/log/nginx
    networks:
      - olgur
      - web
    depends_on:
      php-fpm:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.olgur-api.entrypoints=websecure
      - traefik.http.routers.olgur-api.rule=Host(`api.olgur.de`)
      - traefik.http.routers.olgur-api.tls=true
      - traefik.http.routers.olgur-api.tls.certresolver=letsencrypt
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.5"

  frontend:
    build:
      context: ./frontend
      dockerfile: ${PWD}/docker/production/frontend/Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.olgur.de/api}
        VITE_COOKIE_URL: ${VITE_COOKIE_URL:-https://api.olgur.de/sanctum/csrf-cookie}
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.olgur-frontend.entrypoints=websecure
      - traefik.http.routers.olgur-frontend.rule=Host(`olgur.de`)
      - traefik.http.routers.olgur-frontend.tls=true
      - traefik.http.routers.olgur-frontend.tls.certresolver=letsencrypt
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.25"

  php-fpm:
    build:
      context: ./
      dockerfile: ${PWD}/docker/common/php-fpm/Dockerfile
      target: production
    environment:
      APP_KEY: ${APP_KEY}
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      XDEBUG_HOST: ${XDEBUG_HOST:-host.docker.internal}
      XDEBUG_IDE_KEY: ${XDEBUG_IDE_KEY:-DOCKER}
      XDEBUG_LOG: /dev/stdout
      XDEBUG_LOG_LEVEL: 0
    networks:
      - olgur
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php-fpm-healthcheck"]
      start_period: 10s
      interval: 5s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"

  db:
    image: mariadb:12
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-olgur}
      MYSQL_USER: ${MYSQL_USER:-olgur}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    volumes:
      - olgur-db:/var/lib/mysql
    networks:
      - olgur
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 2s
      timeout: 2s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"

networks:
  olgur:
  web:
    external: true

volumes:
  olgur-db:
